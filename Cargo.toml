[workspace]
members = [
    "src/proto",
    "src/migrations",
    "src/conductor",
    "src/api",
    "src/executor",
    "src/ctx",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Tickr Team"]
license = "Apache-2.0"
repository = "https://github.com/tickr-io/tickr-cli"

[workspace.lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(madsim)"] }

[workspace.dependencies]
tickr_proto = { path = "./src/proto" }
tickr_migrations = { path = "./src/migrations" }
tickr_conductor = { path = "./src/conductor" }
tickr_api = { path = "./src/api" }
tickr_executor = { path = "./src/executor" }
tickr_ctx = { path = "./src/ctx" }

anyhow = "1.0"
async-nats = "0.49.1"
async-stream = "0.3.5"
bincode = "1.3"
prost = "0.13"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10.8"
uuid = { version = "1", features = ["v4", "v5", "serde"] }
chrono = { version = "0.4.41", features = ["serde"] }
chrono-tz = "0.10"
tokio-util = { version = "0.7.11", features = ["time", "rt"] }
tracing-subscriber = "0.3"
tracing = "0.1.41"
slab = "0.4.4"
futures-util = "0.3"
futures = "0.3.31"
clap = { version = "4.5.16", features = ["derive"] }
tokio-stream = "0.1.15"
tempfile = "3.13.0"
async-trait = "0.1.83"
thiserror = "1.0.64"
log = "0.4"
env_logger = "0.11"
once_cell = "1.20"
axum = "0.8"
flate2 = "1.0"
opendal = { version = "0.57", features = ["services-s3"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "postgres", "sqlite", "uuid", "chrono", "json", "macros", "migrate"] }
testcontainers-modules = { version = "0.11", features = ["postgres", "minio", "nats"] }
serde_json_path = { version = "0.7", default-features = false }
hex = "0.4.3"
tower = "0.4.7"
tower-http = { version = "0.6.2", features = ["cors"] }
utoipa = { version = "=5.5.0", features = ["axum_extras", "chrono", "uuid", "preserve_order", "preserve_path_order"] }
utoipa-axum = "=0.2.0"
serde_yaml = "=0.9.34"

[profile.dev]
debug = "line-tables-only"

[package]
name = "tickr"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "tickr"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
tickr_migrations = { workspace = true }
tickr_proto = { workspace = true }
tickr_conductor = { workspace = true }
tickr_api = { workspace = true }
tickr_executor = { workspace = true }
tokio = { version = "1", features = ["full", "tracing"] }
tokio-util = { workspace = true }
clap = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = "1.0"
sqlx = { workspace = true }

[dev-dependencies]
testcontainers-modules = { workspace = true }
tempfile = { workspace = true }

[features]
madsim = ["tickr_conductor/madsim", "tickr_api/madsim"]
