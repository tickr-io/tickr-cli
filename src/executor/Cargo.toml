[package]
name = "tickr_executor"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
# Internal dependencies
tickr_proto = { workspace = true }

# Workspace dependencies
async-nats = { workspace = true }
bincode = { workspace = true }
prost = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
tracing = { workspace = true }
futures = { workspace = true }
tokio-stream = { workspace = true }
async-trait = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
tokio-util = { workspace = true }
log = { workspace = true }
env_logger = { workspace = true }
tokio = { version = "1", features = ["full", "tracing"] }
tonic = { version = "0.12", features = ["transport"] }

# killpg(2) for tearing down task process groups on shutdown — Unix only,
# matching the executor's deployment platform (it shells out to `nix`).
[target.'cfg(unix)'.dependencies]
nix = { version = "0.30", features = ["signal", "process"] }

[dev-dependencies]
# Integration tests stand up an ephemeral JetStream-enabled NATS container to
# exercise the durable task-dispatch work queue (pull-to-capacity, ack-on-pickup).
testcontainers-modules = { workspace = true }